# Nội dung trang "Trợ lý NCKH" / "Research Assistant" (_pages/vi/tro-ly-nckh.md,
# _pages/research-assistant.md, hiển thị bởi _includes/research_assistant.liquid).
#
# Đây là bản giới thiệu tĩnh của hệ thống HUE - Research. Ứng dụng thật chạy ở app_url
# (cần máy chủ, GitHub Pages không chạy được); mã nguồn nằm ở thư mục hue-research/.
# Danh sách công cụ, trạng thái "sắp có" lấy từ hue-research/hce-research/lib/registry.ts:
# khi sửa bên đó thì sửa lại ở đây cho khớp.

