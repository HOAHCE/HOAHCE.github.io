cards:
  - icon: folder-kanban
    path: /projects
    vi:
      title: Dự án nghiên cứu
      text: Theo dõi 6 giai đoạn, nhắc hạn, mời cộng sự và tải tệp nền làm ngữ cảnh cho trợ lý.
    en:
      title: Research projects
      text: Track the six research stages, get deadline reminders, invite collaborators and upload background files as context for the assistant.
  - icon: message-circle
    path: /chat
    vi:
      title: Chatbot
      text: Hỏi đáp trợ lý, tra cứu bài báo, hội thảo–tạp chí, quỹ và quy trình biểu mẫu của Trường.
    en:
      title: Chatbot
      text: Ask the assistant, look up papers, conferences and journals, funds, and the University's procedures and forms.
  - icon: layout-grid
    path: /tools
    vi:
      title: Kho công cụ
      text: Thiết kế khảo sát, tra cứu chuyên gia, tạp chí, quỹ… kèm đánh giá của người dùng.
    en:
      title: Tool library
      text: Survey design, expert search, journals, funds and more, with user ratings.
  - icon: sliders-horizontal
    path: /huong-dan
    vi:
      title: Hướng dẫn
      text: Cách dùng hệ thống theo từng bước của vòng đời nghiên cứu.
    en:
      title: User guide
      text: How to use the system, step by step through the research life cycle.

questions:
  vi:
    - Tôi muốn thiết kế phiếu khảo sát thì dùng công cụ nào?
    - Có những hội thảo nào về kinh tế số sắp diễn ra?
    - Gợi ý tạp chí Q1 về kinh tế để công bố bài báo
    - Cronbach's alpha bao nhiêu là đạt yêu cầu?
  en:
    - Which tool should I use to design a survey questionnaire?
    - Which conferences on the digital economy are coming up?
    - Suggest Q1 economics journals to publish a paper in
    - What Cronbach's alpha value is acceptable?

# Sáu giai đoạn nghiên cứu và các công cụ trong từng giai đoạn (soon: true = "sắp có").
stages:
  - vi: Tìm hiểu
    en: Explore
    tools:
      - {alias: experts, vi: Tìm kiếm chuyên gia, en: Expert search}
      - {alias: topics, vi: Đề tài khoa học, en: Research topics}
  - vi: Tổng quan tài liệu
    en: Literature review
    tools:
      - {alias: papers, vi: Tra cứu bài báo, en: Paper search}
      - {alias: bibliomap, vi: Trắc lượng thư mục, en: Bibliometrics, soon: true}
  - vi: Thiết kế & thu thập dữ liệu
    en: Design & data collection
    tools:
      - {alias: surveylab, vi: Thiết kế khảo sát, en: Survey design}
  - vi: Phân tích
    en: Analysis
    tools:
      - {alias: quantis, vi: Phân tích định lượng, en: Quantitative analysis, soon: true}
      - {alias: annota, vi: Phân tích định tính, en: Qualitative analysis, soon: true}
  - vi: Viết & phản biện
    en: Write & review
    tools:
      - {alias: writium, vi: Viết nghiên cứu, en: Research writing, soon: true}
      - {alias: plagiarism, vi: Kiểm tra đạo văn, en: Plagiarism check, soon: true}
      - {alias: review, vi: Phản biện bài báo, en: Manuscript review, soon: true}
  - vi: Công bố & tài trợ
    en: Publish & funding
    tools:
      - {alias: journals, vi: Hội thảo – tạp chí, en: Conferences & journals}
      - {alias: funds, vi: Tra cứu quỹ, en: Funding search}
      - {alias: regulations, vi: Quy trình, biểu mẫu, en: Procedures & forms}

strings:
  vi:
    heading: Hệ thống hỗ trợ nghiên cứu khoa học dựa trên trí tuệ nhân tạo (AI)
    lead: Nền tảng AI phục vụ hoạt động nghiên cứu tại Trường Đại học Kinh tế, Đại học Huế
    open: Mở ứng dụng HUE - Research
    try: Thử hỏi Trợ lý chính
    try_note: Bấm một câu để dùng thử ngay — câu hỏi được điền sẵn, bạn sửa được trước khi gửi.
    stages: Sáu giai đoạn nghiên cứu
    soon: sắp có
    note: Ứng dụng chạy trên máy chủ riêng tại hi.hue.vn; các nút trên trang này sẽ mở ứng dụng ở một tab mới. Đăng nhập bằng email, GitHub hoặc ORCID, khách dùng được ngay với hạn mức thấp.
  en:
    heading: AI-based research support system
    lead: An AI platform supporting research at the University of Economics, Hue University
    open: Open HUE - Research
    try: Try asking the main assistant
    try_note: Click a question to try it straight away — it is pre-filled and you can edit it before sending.
    stages: The six research stages
    soon: coming soon
    note: The application runs on its own server at hi.hue.vn; the buttons on this page open it in a new tab. Sign in with email, GitHub or ORCID; guests can use it straight away with a low quota.
